<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicação que (Des)vela — Marcus Vinicius Leite</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  .hero-inner { max-width: 860px; margin: 0 auto; position: relative; }

  .hero-title-gold {
    font-family: 'Cormorant Garamond', serif;

    font-weight: 700;
    font-style: italic;
    color: var(--gold);
    line-height: 1.05;
    margin-bottom: 40px;
    display: block;
  }
  .hero-sub {
    font-size: 18px; font-weight: 300;
    color: var(--gray);

    line-height: 1.7;

  .hero-cta-group { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .hero-price {

  }
  .module-item:hover .module-num { color: var(--gold); }

  }

    max-width: 700px; margin: 0 auto;

  }
  .author-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px; font-weight: 600;
    color: var(--white); margin-bottom: 8px;
  }
  .author-role { font-size: 13px; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 24px; }
  .author-line { width: 40px; height: 1px; background: var(--gold); margin-bottom: 24px; }
  .author p { font-size: 16px; color: var(--gray); line-height: 1.8; margin-bottom: 16px; }
  .author p strong { color: var(--cream); font-weight: 400; }
  @media (max-width: 600px) {
    .author-inner { grid-template-columns: 1fr; gap: 32px; }
  }
  .pricing {
    padding: 120px 32px;
    text-align: center;
  }
  .pricing-card {
    max-width: 520px; margin: 0 auto;
    border: 1px solid rgba(184,144,74,0.3);
    padding: 64px 48px;

    padding: 4px 16px; border: 1px solid rgba(184,144,74,0.3);
  }
  .pricing-label { font-size: 12px; letter-spacing: 0.15em; color: var(--gray); margin-bottom: 24px; }
  .pricing-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 80px; font-weight: 300; color: var(--white);
    line-height: 1; margin-bottom: 8px;
  }
  .pricing-price sup { font-size: 32px; vertical-align: super; color: var(--gold); }
  .pricing-period { font-size: 14px; color: var(--gray); margin-bottom: 40px; }
  .pricing-includes { text-align: left; margin-bottom: 48px; }
  .pricing-includes li {
    list-style: none; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 15px; color: var(--cream);
    display: flex; align-items: center; gap: 12px;
  }
  .pricing-includes li::before { content: '—'; color: var(--gold); flex-shrink: 0; }

    width: 100%; padding: 18px;
    background: var(--gold); color: var(--dark);
